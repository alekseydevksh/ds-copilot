services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ds-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ds_copilot
    ports:
      # Host port 5433 avoids clashing with a Postgres already installed on the machine
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ds_copilot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
